# Infraestrutura de desenvolvimento do portfolio-api.
# Uso:  docker compose up -d     (sobe)
#       docker compose down      (para; os dados ficam no volume)
#       docker compose down -v   (para e APAGA os dados)
# As variaveis (${...}) vem do arquivo .env (copie de .env.example).

services:
  postgres:
    image: postgres:17
    container_name: portfolio-postgres
    environment:
      # A imagem oficial cria o usuario e o banco na primeira inicializacao (volume vazio)
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Porta 5433 no computador -> 5432 no container.
      # (A 5432 do Windows pode estar ocupada por um PostgreSQL instalado localmente.)
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # So considera "saudavel" quando o Postgres aceita conexoes no banco "portfolio"
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor de e-mail FALSO para desenvolvimento: aceita tudo que a API envia por SMTP
  # e mostra numa pagina web, sem entregar a ninguem de verdade.
  # Caixa de entrada: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: portfolio-mailpit
    ports:
      - "1025:1025" # SMTP (onde a API envia)
      - "8025:8025" # interface web

volumes:
  postgres-data:
