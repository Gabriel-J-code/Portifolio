# Infraestrutura de desenvolvimento do portfolio-api.
# Uso:  docker compose up -d     (sobe)
#       docker compose down      (para; os dados ficam no volume)
#       docker compose down -v   (para e APAGA os dados)
# As variaveis (${...}) vem do arquivo .env (copie de .env.example).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: portfolio-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # So considera "saudavel" quando o SQL Server aceita login e responde a uma query
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Container de execucao unica: cria o banco "portfolio" se ele ainda nao existir.
  # (A imagem do SQL Server nao tem variavel para criar banco automaticamente.)
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID('portfolio') IS NULL CREATE DATABASE portfolio"
    restart: "no"

  # Servidor de e-mail FALSO para desenvolvimento: aceita tudo que a API envia por SMTP
  # e mostra numa pagina web, sem entregar a ninguem de verdade.
  # Caixa de entrada: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: portfolio-mailpit
    ports:
      - "1025:1025" # SMTP (onde a API envia)
      - "8025:8025" # interface web

volumes:
  sqlserver-data:
