# =====================================================================
# Perfil de PRODUCAO. Ativado com a variavel de ambiente SPRING_PROFILES_ACTIVE=prod.
# Este arquivo SOBRESCREVE o application.properties apenas nas chaves abaixo; o resto vale igual.
#
# Regra: em producao nada pode cair num padrao de desenvolvimento (localhost, Mailpit...).
# Por isso as variaveis abaixo nao tem valor padrao. Se faltar alguma, a API falha ao subir
# (banco, CORS, remetente, JWT) ou no primeiro uso (SMTP: o login responde 503), em vez de
# funcionar "pela metade" apontando para o lugar errado.
# =====================================================================

# --- Servidor ---
# O Cloud Run informa a porta pela variavel PORT
server.port=${PORT:8080}
# A API fica atras do proxy HTTPS do Cloud Run, que repassa a requisicao em HTTP.
# Sem isto, a API acha que foi chamada em http:// e monta links errados (ex.: o cabecalho Location do 201).
# "framework" = o Spring le os cabecalhos X-Forwarded-Proto/Host enviados pelo proxy.
server.forward-headers-strategy=framework

# --- Banco de dados ---
# URL completa obrigatoria. Provedores gerenciados exigem TLS: inclua ?sslmode=require
# (ex.: jdbc:postgresql://<host>/portfolio?sslmode=require)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Nao imprimir SQL no log de producao (ruido e possivel exposicao de dados)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- E-mail (SMTP real, ex.: Gmail com senha de app, SendGrid, Brevo) ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# Provedores reais exigem login e conexao criptografada (STARTTLS na porta 587)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Nao deixar o login travado se o SMTP nao responder (ms)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Remetente obrigatorio (em geral precisa ser o proprio e-mail da conta SMTP)
app.auth.remetente=${MAIL_FROM}

# --- CORS ---
# Somente o dominio real do front (nada de localhost em producao)
app.cors.origens-permitidas=${CORS_ORIGINS}

# --- Swagger desligado ---
# O mapa completo da API (inclusive rotas do painel) nao fica publico em producao
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
