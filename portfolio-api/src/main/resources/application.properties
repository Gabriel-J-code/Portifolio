spring.application.name=portfolio-api

# Le o arquivo .env (formato CHAVE=valor) como propriedades, se existir.
# Assim a mesma senha do docker-compose chega na aplicacao sem duplicar.
# Em producao (Cloud Run) o arquivo nao existe e as variaveis de ambiente reais sao usadas.
spring.config.import=optional:file:.env[.properties]

# --- Banco de dados (SQL Server) ---
# Valores vem de variaveis de ambiente; o que esta depois do ":" e o padrao para desenvolvimento local.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=portfolio;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# update: cria/ajusta as tabelas a partir das entidades (bom para desenvolvimento; em producao prefira "validate" + migrations)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Strings como NVARCHAR (suporte completo a acentos/Unicode no SQL Server)
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# Desliga o "Open Session in View": a conexao com o banco nao fica aberta ate o JSON ser escrito.
# Os services ja devolvem DTOs montados dentro da transacao, entao nao precisamos dele.
spring.jpa.open-in-view=false

# --- E-mail (SMTP) ---
# Padrao: Mailpit do docker-compose (e-mails aparecem em http://localhost:8025).
# Em producao: host/porta/usuario/senha de um SMTP real (ex.: Gmail com senha de app, SendGrid).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# --- Autenticacao (lido pela classe AuthProperties) ---
# Conta do painel criada na primeira inicializacao, se a tabela "acessos" estiver vazia
app.auth.admin-email=${ADMIN_EMAIL}
app.auth.admin-senha=${ADMIN_PASSWORD}
# Por quanto tempo o codigo enviado por e-mail vale (formato Duration: 10m, 90s...)
app.auth.codigo-validade=10m
app.auth.remetente=${MAIL_FROM:nao-responda@portfolio.local}
# Erros de codigo permitidos; ao atingir o limite o codigo e invalidado (protege contra "chutar" os 6 digitos)
app.auth.max-tentativas-codigo=5
# Chave secreta (Base64, 32 bytes) que assina os tokens JWT, e por quanto tempo um token vale
app.auth.jwt-secret=${JWT_SECRET}
app.auth.token-validade=2h

# --- CORS (lido pela classe CorsProperties) ---
# Sites que podem chamar a API pelo navegador, separados por virgula. [*] = qualquer porta.
# Padrao: Flutter Web local. Em producao: CORS_ORIGINS=https://<dominio-do-front>
app.cors.origens-permitidas=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# --- Swagger / OpenAPI ---
# UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
