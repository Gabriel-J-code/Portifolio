spring.application.name=portfolio-api

# Le o arquivo .env (formato CHAVE=valor) como propriedades, se existir.
# Assim a mesma senha do docker-compose chega na aplicacao sem duplicar.
# Em producao (Cloud Run) o arquivo nao existe e as variaveis de ambiente reais sao usadas.
spring.config.import=optional:file:.env[.properties]

# --- Banco de dados (SQL Server) ---
# Valores vem de variaveis de ambiente; o que esta depois do ":" e o padrao para desenvolvimento local.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=portfolio;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# update: cria/ajusta as tabelas a partir das entidades (bom para desenvolvimento; em producao prefira "validate" + migrations)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Strings como NVARCHAR (suporte completo a acentos/Unicode no SQL Server)
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# Desliga o "Open Session in View": a conexao com o banco nao fica aberta ate o JSON ser escrito.
# Os services ja devolvem DTOs montados dentro da transacao, entao nao precisamos dele.
spring.jpa.open-in-view=false

# --- Swagger / OpenAPI ---
# UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
